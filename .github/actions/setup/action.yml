name: Setup repository for actions
description: "Setup repository for actions"

runs:
  using: "composite"
  steps:
    - name: Identify shell
      id: shell_id
      uses: ./.github/actions/get_shell

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.21.0'

    - name: Restore Go modules cache
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Install keyring on Ubuntu
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: | 
        sudo rm /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt-get install dbus-x11
        sudo apt-get install -y gnome-keyring
        dbus-launch --sh-syntax
        echo '' | /usr/bin/gnome-keyring-daemon --unlock

    - name: Download dependencies
      shell: ${{ steps.shell_id.outputs.shell }}
      run: go mod download

