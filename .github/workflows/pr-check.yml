name: CLI PR Check

on:
  pull_request:

# PRs need no write access. Explicit least-privilege matters on a public
# repo, where the default GITHUB_TOKEN scope is often read/write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Action
        uses: ./.github/actions/setup

      - name: Verify formatting
        if: ${{ runner.os == 'Linux' }}
        run: |
          # i18n/resources is generated by go-bindata and is not gofmt-clean by
          # design; temp/ is local scratch. Everything else must be formatted.
          unformatted=$(gofmt -l . | grep -v -e '^temp/' -e '^i18n/resources/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean. Run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: ${{ runner.os == 'Linux' }}
        run: go vet ./...

      - name: Run unit tests
        run: make test

      - name: Build
        run: make build

